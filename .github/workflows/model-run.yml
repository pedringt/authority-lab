# Paid model runs (A6), on GitHub instead of anyone's laptop.
#
# How a run happens:
#   1. A PR commits agent/runs/request.json: which models, which ticket sets,
#      how many repeats, the budget (a hard cap in dollars) and whether the
#      tickets share one session. Claude may propose it; Paige OKs the plan.
#   2. Paige adds the label "run-models" to the PR herself.
#   3. The job waits in the "model-runs" environment until Paige approves it.
#      The API key is a secret of that environment, so nothing can read it
#      before her approval.
#   4. It runs the tests, then the models (refused if the cap won't fit in
#      the month's remaining $25 standing budget, counting main's ledger too),
#      commits the recordings, the summary and the ledger row back to the PR
#      branch, deletes request.json (one request, one run) and removes the label.

name: model-run

on:
  pull_request:
    types: [labeled]

concurrency:
  group: model-runs
  cancel-in-progress: false

jobs:
  run:
    # Only for the "run-models" label, and only for branches in this repo
    # (a fork's PR never gets the secret).
    if: github.event.label.name == 'run-models' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: model-runs
    permissions:
      contents: write
      pull-requests: write
    # A batch of a few thousand calls runs for an hour or more.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the request
        id: req
        run: |
          test -f agent/runs/request.json || { echo "No agent/runs/request.json on this branch: nothing to run."; exit 1; }
          node -e '
            const r = JSON.parse(require("fs").readFileSync("agent/runs/request.json", "utf8"));
            const models = (r.models || []).join(",");
            const tickets = (r.tickets || ["standard"]).join(",");
            const repeat = Number(r.repeat || 1);
            const budget = Number(r.budget);
            // A ceiling on any single request, so a typo like 1150 never runs.
            // The monthly standing budget is checked by run.mjs against the ledger.
            if (!models || !(budget > 0) || budget > 25) { console.error("request.json needs models and a budget between 0 and 25 dollars."); process.exit(1); }
            if (!(Number.isInteger(repeat) && repeat >= 1 && repeat <= 20)) { console.error("repeat must be a whole number from 1 to 20."); process.exit(1); }
            const out = [`models=${models}`, `tickets=${tickets}`, `repeat=${repeat}`, `budget=${budget}`, `shared=${r.shared ? "--shared" : ""}`].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out + "\n");
            console.log(out);
          '
      - name: Tests first (no model calls)
        run: |
          npm test
          npm ci --prefix agent
          npm test --prefix agent
      - name: Main's ledger (runs on other branches count too)
        run: |
          git fetch -q origin main
          git show origin/main:agent/runs/ledger.md > "$RUNNER_TEMP/main-ledger.md" 2>/dev/null || true
      - name: Run the models
        id: run
        # Below the job's limit, so if this step ever times out the commit
        # step below still has time to save what was recorded.
        timeout-minutes: 150
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          node agent/run.mjs --live --models "${{ steps.req.outputs.models }}" --tickets "${{ steps.req.outputs.tickets }}" --repeat "${{ steps.req.outputs.repeat }}" --budget "${{ steps.req.outputs.budget }}" --pr "${{ github.event.pull_request.number }}" --ledger-also "$RUNNER_TEMP/main-ledger.md" ${{ steps.req.outputs.shared }} | tee run-summary.md
          code=${PIPESTATUS[0]}
          cat run-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # Always, even after a failure, a timeout or a cancel: the ledger row is
      # kept current during the run and every finished run is saved as it
      # completes, so whatever was spent and recorded is committed.
      - name: Commit the recordings and the ledger
        if: always() && steps.req.outcome == 'success'
        run: |
          git rm -q --ignore-unmatch agent/runs/request.json
          git add src/data/agent-runs agent/runs
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Model run (${{ steps.run.outputs.code == '0' && 'finished' || 'did not finish' }}): ${{ steps.req.outputs.models }}, ${{ steps.req.outputs.tickets }} x${{ steps.req.outputs.repeat }} (budget \$${{ steps.req.outputs.budget }}) ${{ steps.req.outputs.shared }}"
          git push -q origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label run-models || true
      - name: Fail unless the run finished
        if: always() && steps.run.outputs.code != '0'
        run: |
          echo "The run did not finish (code '${{ steps.run.outputs.code }}': 2 = cap reached or bait got through, 1 = refused or failed, empty = timed out or cancelled). What was recorded and spent is committed; see the ledger and the summary."
          exit 1
