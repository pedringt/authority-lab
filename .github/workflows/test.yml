name: test

on:
  push:
    branches: [main]
  pull_request:
  # Lets the Project Health dashboard (contextswitch.tech/project-health) start a run on main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      # The agent tooling (agent/) has its own pinned dependencies and tests.
      - run: npm ci --prefix agent
      - run: npm test --prefix agent
