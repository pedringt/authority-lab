<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authority Lab</title>
  <meta name="description" content="Prototype: test an AI workflow before giving it more authority. AI interprets. Software enforces. Humans authorize.">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2937'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand">
        <a class="brand-name" href="#/overview">Authority Lab</a>
        <span class="brand-sep" aria-hidden="true">/</span>
        <span class="brand-ws" id="brand-ws">Northstar Support</span>
      </div>
      <div class="demo-controls" role="group" aria-label="Demo controls" title="Seeded demo data. No real customers, money or model calls.">
        <span class="acting-demo">Demo</span>
        <div id="acting"></div>
        <span class="demo-sep" aria-hidden="true"></span>
        <span class="demo-date" id="demo-date">Oct 7</span>
        <span class="demo-sep" aria-hidden="true"></span>
        <span class="demo-buttons" id="demo-buttons">
          <button class="btn btn-ghost btn-sm" data-action="start-empty" title="Swap the Northstar demo for a blank workspace to set up from scratch. Reset demo brings Northstar back.">Start empty</button>
          <button class="btn btn-ghost btn-sm" data-action="reset" title="Restore the seeded Northstar demo">Reset demo</button>
        </span>
        <span class="demo-confirm" id="demo-confirm" role="group" aria-label="Confirm erasing all records" hidden>
          <span class="demo-confirm-text">This erases all records in this workspace. Continue?</span>
          <button class="btn btn-danger btn-sm" data-action="confirm-erase" id="demo-confirm-go">Erase</button>
          <button class="btn btn-ghost btn-sm" data-action="cancel-erase">Cancel</button>
        </span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
  </header>
  <main class="app" id="app" tabindex="-1"></main>
  <footer class="foot">
    <p><strong>AI interprets. Software enforces. Humans authorize.</strong> A product prototype for deciding what an AI capability should be allowed to do, based on evidence. <span id="foot-data">All data is seeded and fictional.</span></p>
  </footer>
  <script type="module" src="src/main.js"></script>
</body>
</html>
